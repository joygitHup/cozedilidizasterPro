# 生产前置网关示例：限流 + 访问审计日志
# 用法：include 到 http{} / server{}，并按实际 upstream 调整
#
#   docker run / 本机 nginx -c ... 或复制片段到现有站点配置

upstream geohazard_django {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 全局限流区：每 IP 每秒 20 请求，桶容量 40（突发）
limit_req_zone $binary_remote_addr zone=geohazard_api:10m rate=20r/s;
# 登录更严
limit_req_zone $binary_remote_addr zone=geohazard_login:5m rate=5r/s;

# 审计用访问日志格式（可对接 ELK / 文件采集）
log_format geohazard_audit '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
    'uid="$http_x_request_id" ua="$http_user_agent" '
    'auth="$http_authorization"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/geohazard_access.log geohazard_audit;
    error_log  /var/log/nginx/geohazard_error.log warn;

    client_max_body_size 20m;

    # 真实 IP（若还有更外层 LB，按实际调整）
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;

    location /api/users/login/ {
        limit_req zone=geohazard_login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://geohazard_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /storage-api/ {
        proxy_pass http://127.0.0.1:8700/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        client_max_body_size 100m;
    }

    location /api/ {
        limit_req zone=geohazard_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://geohazard_django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # IoT ingest：限流交给 Django ingest 鉴权模块；此处可单独放宽或 IP allow
    location /api/monitoring/ingest/ {
        # allow 10.0.0.0/8; deny all;
        proxy_pass http://geohazard_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://geohazard_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }
}
